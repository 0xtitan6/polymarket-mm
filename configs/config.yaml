dry_run: true  # set to false for live trading

auth:
  api_key_id: ""          # set via POLY_API_KEY_ID env (UUID from polymarket.us/developer)
  private_key_b64: ""     # set via POLY_PRIVATE_KEY_B64 env (base64-encoded Ed25519 private key)

api:
  base_url: "https://api.polymarket.us"
  ws_market_url: "wss://api.polymarket.us/v1/ws/markets"
  ws_private_url: "wss://api.polymarket.us/v1/ws/private"

strategy:
  gamma: 0.20               # higher risk aversion for game-day markets (fast moves)
  sigma: 0.6                # higher vol — game-day prices swing on live scores
  k: 1.5                    # higher order arrival — game markets are more active
  t: 0.00137                # shorter horizon (~0.5 day) — games resolve today
  default_spread_bps: 100   # 1% minimum spread — need to be AT the BBO to get filled
  order_size_usd: 3.0       # $3 per side — spread across more markets
  refresh_interval: 10s     # faster refresh for game-day markets
  stale_book_timeout: 90s   # shorter timeout — game markets should be active

  # Toxic flow detection
  flow_window: 60s                    # Tighter window — game-day flow moves fast
  flow_toxicity_threshold: 0.5        # Lower threshold — be cautious on game day
  flow_cooldown_period: 120s          # 2 min — game-day markets recover faster
  flow_max_spread_multiplier: 2.5     # Max 2.5x spread widening

risk:
  max_position_per_market: 3.0    # $3 max per market — spread risk across more games
  max_global_exposure: 10.0       # $10 total
  max_markets_active: 5           # 5 game markets active simultaneously
  kill_switch_drop_pct: 0.30      # 30% price move triggers kill (game results swing hard)
  kill_switch_window_sec: 60
  max_daily_loss: 3.0             # $3 daily loss limit (30% of capital)
  cooldown_after_kill: 5m

scanner:
  poll_interval: 60s              # scan every 1 min — game markets are dynamic
  min_liquidity: 0                # US API doesn't provide inline liquidity data
  min_volume_24h: 0               # US API doesn't provide inline volume data
  min_spread: 0.005           # 0.5% minimum — tight spreads are fine, we want fills
  max_end_date_days: 30           # only near-term markets
  include_slugs: []               # leave empty to let keyword matching handle it
  include_keywords: []              # e.g. ["aec-nba-det-orl-2026-03-01"] — filter by market slug keywords
  exclude_keywords: []            # nothing to exclude
  exclude_slugs: []

store:
  data_dir: "./data"

logging:
  level: "info"
  format: "json"

dashboard:
  enabled: true
  port: 8080
  allowed_origins: [] # optional allowlist, e.g. ["http://localhost:8080"]
